[project]
name = "recolor"
version = "0.1.0"
description = "A simple open-source photo color grading app for android."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Shopon Hossen", email = "shoponhossen@gmail.com" }
]
dependencies = [
    "flet>=1.0.3",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.208",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "flet-web>=1.0.3",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "shopon"
product = "ReColor"
company = "Shopon"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"


[tool.flet.boot_screen.flet]
theme_mode = "dark"
spinner_color_dark = "#FF6D00"
spinner_size = 30
startup_message = "ReColor"
